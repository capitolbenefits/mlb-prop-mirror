name: mlb-prop-mirror

# Fetches the MLB statsapi data the prop-top3 task needs and commits it as JSON.
# GitHub runners have full internet, so statsapi is reachable here even though
# the Cowork sandbox cannot reach it directly.

on:
  workflow_dispatch: {}        # allow manual runs from the Actions tab
  schedule:
    # Times are UTC. Eastern Daylight is UTC-4. GitHub queues scheduled runs on
    # shared infrastructure and frequently delays them by several hours (worst in
    # the early-UTC-morning slots), so pinning a few exact times is unreliable.
    # Instead we refresh every 2 hours all day, which keeps the data inside the
    # prop-top3 task's freshness window no matter how late any single run fires,
    # plus extra attempts right before each task run. Odd minutes avoid the
    # high-contention :00 and :30 slots GitHub is most likely to drop.
    - cron: "13 */2 * * *"        # baseline: every 2 hours, all day
    - cron: "7 7,8,9 * * *"       # ~03:07 to 05:07 ET: extra runs before the 6 AM ET task
    - cron: "7 16,17,18 * * *"    # ~12:07 to 14:07 ET: extra runs before the 3 PM ET task

permissions:
  contents: write              # needed to commit the refreshed JSON

concurrency:
  group: mlb-prop-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch statsapi data
        run: python fetch_mlb.py

      - name: Commit refreshed data
        run: |
          git config user.name  "mlb-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "mirror: refresh statsapi data ($(date -u +%FT%TZ))"
            git push
          fi
